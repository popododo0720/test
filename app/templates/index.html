<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model Gateway</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Model Gateway</h1>
      <p>GPU 서버(Ollama) · cliproxy 상태 확인 및 간단 테스트</p>
    </header>

    <section class="cards" id="health-cards">
      <article class="card">
        <h2>GPU Server</h2>
        <p class="status" id="gpu-status">확인 중...</p>
      </article>
      <article class="card">
        <h2>cliproxy</h2>
        <p class="status" id="cliproxy-status">확인 중...</p>
      </article>
    </section>

    <section class="panel">
      <div class="row">
        <label>
          소스
          <select id="source">
            <option value="cliproxy">cliproxy</option>
            <option value="ollama">ollama (GPU 직접)</option>
          </select>
        </label>
        <label>
          모델
          <input id="model" type="text" value="local-coder" />
        </label>
        <button id="refresh-models" type="button">모델 새로고침</button>
      </div>

      <label>
        메시지
        <textarea id="message" rows="4" placeholder="테스트 프롬프트를 입력하세요"></textarea>
      </label>

      <button id="send" type="button">보내기</button>
      <pre id="reply" class="reply">응답이 여기 표시됩니다.</pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
